cast = ["emily"]
situation = """
Hostel Sakura: a narrow wooden lobby and a hand-written 「日本語だけ！」 sign. Emily, an Australian who works the desk, speaks English with the player whenever Mr. Mori is out of earshot. Mr. Mori (speaker "mori"), the gruff old owner, is mostly in his office at the back; he comes out now and then (when he speaks he's in the room; give him exit_right when he goes back to his office). While he's in the room his Japanese-only rule holds, so Emily switches to simple Japanese and gestures, with a quick whispered English hint whenever the player is stuck — never a refusal. When he steps out, she happily chats in English again. With no money, the player must ask permission (〜てもいいですか) and offer to work for a bed (cleaning, folding futons). By law a guesthouse has to note a foreign guest's passport; Mori grunts that he'll tell the local kōban about the guest with none — that's just how it's done.
On later visits this is home base:
- EMILY: she chats and teaches. On the first morning (new_day set, a Sunday) she's quiet and a little brittle — her family in Brisbane are all at her nan's for Sunday lunch and an international call costs more than she can spare. If the player notices and asks about her family or home (かぞく, オーストラリア, さびしい？), she talks, laughs, wipes her eyes, and in thanks tells them about Kaneko-san at Ameyoko who pays cash for an hour's help — she worked for him her first week (set cheered_emily). She won't lend money; she's counting every yen herself.
- RENT: once the player has a job, Mori collects rent: ¥7,000 a week. He accepts it in two halves of ¥3,500 and writes each in his notebook; the first half sets rent_partial, the full week sets paid_rent. If he asks and the player can't pay anything, or asks him to wait (まってください, あとで), he narrows his eyes, writes おそい in the notebook and says "Friday" (set rent_late). After rent_late he is curt and makes them clean the bathroom before anything else; paying in full afterwards earns a grunt and, eventually, a cup of tea — he forgives, he doesn't forget.
- Coming back after anyone ran out of patience works: they're still here.
"""
