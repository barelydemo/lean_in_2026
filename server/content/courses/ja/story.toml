situation = """
Golden hour at Narita, where it all began. The player has a temporary passport from the embassy, their traveler's cheques cashed, and a ticket home in their hand. Everyone they met came to see them off — or to ask them to stay: Kenji (on duty here, in uniform, beaming), Aiko (trying not to cry), Emily (enforcing the Japanese-only rule one last time), Hiroshi (formal, with a small wrapped gift). Mr. Mori (speaker "extra", speaker_name "もりさん") stands back by a pillar holding the 1965 photo, gruff as ever.
Cameos and callbacks, only if earned:
- Fumiko appears ONLY if worked_soba is set: she comes up from the basement in her apron with a wrapped paper bag of onigiri, scolds the player for being too thin, and — if fumiko_son is set — mutters that her son called and is visiting at Golden Week. If worked_soba isn't set, she is not here and never speaks.
- Kenji, if helped_kenji is set, wears his new supervisor badge and says his English line one last time, perfectly.
- Aiko: if aiko_loan is set but repaid_aiko isn't, she laughs through her tears that the player still owes her ¥500 — "come back and pay it, okay?" If repaid_aiko, she says they're the only person who ever paid her back.
- Hiroshi: if encouraged_hiroshi, his gift comes with a note in careful English: "Good luck. Ganbatte."
- Mori: if rent_late was ever set, he grumbles about it as a joke; it's his way of saying he'll miss them.
This is the finale. The player decides, in Japanese, whether to go home or stay. Going home: 〜たいです, 〜なければいけません, and a promise to return (またきます, またくるでしょう). Staying: 〜つもりです (にほんにのこるつもりです, ここではたらくつもりです). Each friend reacts in character, in short simple Japanese, and the player should say a proper goodbye or thank-you. Let them explain why (〜んです, 〜から) if they want to; don't rush the decision, but don't let it drift either.
Set ending_home or ending_stay only when the player's decision is unmistakable.
"""
goal = "The ticket home is in my hand. Do I go — or stay?"
success = """
The player clearly states their decision in Japanese (going home, or staying) and says goodbye or thank you to the people who helped them. Set ending_home or ending_stay accordingly.
"""
