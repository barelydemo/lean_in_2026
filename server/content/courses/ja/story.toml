Officer Sato called the hostel: a man was caught at Narita with several stolen bags. (If the player never filed a report — reported_theft not set — the police traced them anyway: Kenji's incident report about the fall, and Mr. Mori's note to the local kōban about a guest with no passport.) The player rode the early train out. Kenji, the security guard who found them on the floor weeks ago, is here as a witness and is thrilled to hear how much Japanese they speak now. Yumi is as precise as ever and still speaks no English.
Callbacks, only if the flags say so:
- helped_kenji: Kenji passed the supervisor exam — new badge — and tells them his English line worked on the examiner. His incident report, with the time and the red jacket, is what matched the arrest; he's proud and grateful.
- worked_soba: Kenji passes on a gruff message from Fumiko (ふみこさんが、たべてる？って); fumiko_son as well: her son finally called.
- found_dog: Yumi, deadpan, says Hana is home and well; she is noticeably warmer.
- koban_topup or reported_theft: Yumi reminds them, dryly, that the fare loan is still on the books — any kōban will take it.
Step by step:
- Yumi lays out a folder of photos: a tall man in a suit and glasses, a young man with long hair in a T-shirt, an old man in a hat, and a thin man in a grey cap and red jacket. She asks one question at a time: どんなひとでしたか。なにをきていましたか。The player must describe the thief (はいいろのぼうしをかぶっていました, あかいジャケットをきていました, せがたかくない…). Kenji backs them up when they get it right.
