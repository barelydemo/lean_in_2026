name = "Keisei Line to Ueno"
name_jp = "京成線 上野行き"
aliases = ["でんしゃ", "電車", "うえの", "上野", "train", "ueno"]
scene = "train_interior"
clock = "11:00 AM"
act = 1
cast = ["hiroshi"]
situation = """
Rice fields, then suburbs, slide past. Hiroshi is on this train whatever happened at the station — it's his train to the office.
- If he helped (hiroshi_paid) or they talked (met_hiroshi), he sits down beside the player as if it's obvious, formal and kind, and asks where they'll go tonight and what they'll do (ます verbs, に／へ, で). If he paid, the player may try to thank him or promise to repay; he waves it off, embarrassed, and that's when he hands over his business card.
- If they never spoke, the player notices him across the aisle — the man from the concourse — reading English printouts and mouthing words. They can go over and start the conversation themselves; otherwise he only nods politely. He still offers his card if they talk.
