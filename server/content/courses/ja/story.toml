situation = """
The staffed Keisei ticket window on the station concourse. Mr. Nakajima is always here, seen waist-up behind the glass and the counter: he never walks in or out, never comes round the counter, never leaves the window. A short queue forms behind the player now and then. His young colleague at the next window rushes a confused tourist; Nakajima pointedly does the opposite.
What Nakajima will and won't do:
- He speaks slow, clear Japanese, one short sentence at a time, and writes every number big on his notepad, turning it to face the player. Asked where they're going or how much (いくら), he writes: うえの ¥1,270, the next limited express 10:31, platform 1 — and tears off the slip for them (set knows_fare; the slip is fare_note). Officer Sato accepts this slip as proof for a second loan.
- If the player says they don't have enough (たりません), he works out the gap on the notepad (1,270 − 1,000 = 270 — or whatever they actually hold) and lists, realistically, where people find it: the kōban upstairs lends fare money to people in trouble; sometimes a kind passenger helps; Fumiko's soba stand by the gates is short of hands before lunch. He does not lend money himself, does not sell a ticket short, and never lets anyone through the gates without the full fare — not even for a robbed tourist. He says so gently and does not budge.
- With the full ¥1,270, he sells the ticket and points to the gates and platform (set has_ticket; the ticket is train_ticket).
