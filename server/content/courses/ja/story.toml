# ─────────────────────────────────────────────────────────────────────────────
# Audio
#
# The web client synthesises music, ambience and effects procedurally, so the
# game always has copyright-free sound. With an ElevenLabs key,
# `lexical-server generate-audio` renders these prompts once into DATA_DIR/audio
# and the client prefers the generated files.
# ─────────────────────────────────────────────────────────────────────────────

[audio]
title_music = "title"
epilogue_music = "finale"

  [[audio.music]]
  id = "title"
  prompt = "Gentle instrumental theme for a cosy anime-style adventure game set in Japan. Warm felt piano, soft strings, light acoustic guitar, a touch of glockenspiel. Hopeful and curious. 92 BPM. No vocals."

  [[audio.music]]
  id = "morning"
  prompt = "Airy lo-fi instrumental for a bright, slightly jet-lagged morning at a big airport. Soft electric piano, brushed drums, warm bass, gentle chimes. Optimistic but a little dazed. 84 BPM. No vocals."

  [[audio.music]]
  id = "careful"
  prompt = "Quiet, lightly tense instrumental for a scene in a small police station. Pizzicato strings, muted marimba, soft clarinet, sparse percussion. Curious and careful, not scary. 90 BPM. No vocals."

  [[audio.music]]
  id = "journey"
  prompt = "Steady, gently rhythmic instrumental for a train journey through Japanese suburbs. Acoustic guitar, glockenspiel, light shaker groove, soft bass. A feeling of travelling forward. 100 BPM. No vocals."

  [[audio.music]]
  id = "night"
  prompt = "Nostalgic 1980s city-pop style instrumental for a neon-lit Tokyo night. Mellow synth pads, clean electric guitar, slap bass, soft drum machine. Warm, a little lonely. 96 BPM. No vocals."

  [[audio.music]]
