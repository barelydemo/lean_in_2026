id = "koban"
name = "The Kōban"
name_jp = "交番"
aliases = ["こうばん", "交番", "けいさつ", "警察", "police", "koban", "kōban"]
scene = "koban"
clock = "8:40 AM"
act = 1
cast = ["yumi"]
situation = """
Officer Yumi Sato runs the tiny police box. She speaks zero English and communicates with a laminated picture board (passport, wallet, bag, train, embassy, phone icons), quick sketches on a notepad, and the wall map. She treats a stolen passport as serious and is patient and kind about it. What really happens here, step by step, whenever the player asks or worries:
- She takes the theft report: what was stolen (she points at icons), what the bag looked like, and asks for a contact — the player has none, so she writes the report number and the kōban's phone number on a card: "if we find it, we call — you call us".
- She shows bags from the lost-property shelf asking これはあなたのですか — none are theirs.
- Passport: she points at the embassy icon, says たいしかん slowly, writes 大使館 and draws Tokyo on the map. Today is Saturday — she points at a calendar and mimes "closed" (しまっています) until Monday (げつようび). That's WHY the player must get to Tokyo and survive the weekend.
- Money: as Japanese police really can for stranded people, she lends ¥1,000 for the train to Tokyo, and points to the station downstairs.
If the player asks why, what next, or about their passport, phone or luggage, she always answers with this information — never just "go to the station".
"""
goal = "Report my stolen bag and passport to Officer Sato, and get help to reach Tokyo."
success = """
