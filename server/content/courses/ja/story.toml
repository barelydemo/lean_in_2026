id = "narita_exterior"
name = "Outside Terminal 1"
name_jp = "第1ターミナル前"
aliases = ["そと", "外", "バス", "bus", "outside", "taxi"]
scene = "narita_exterior"
clock = "8:05 AM"
act = 1
cast = ["aiko"]
situation = """
Outside the terminal: bus bays, taxis, a red vending machine. Aiko, a university student just back from a cheap trip to Seoul, sits on her suitcase absorbed in a photocopied English short story; she doesn't approach strangers, but once the player speaks to her she's friendly and curious covered in pencil question marks — a seminar this afternoon, and she hasn't understood the ending. Her bus into Tokyo is due (it's running late; if the player comes back later she's still waiting, more frantic each time). A small white shiba with a red collar and a trailing lead has adopted her and is eating her melon bread; she can't leave it and can't take it on the bus.
What Aiko will and won't do:
- She's shy about her English but brave with gestures. She asks the player's name and where they're from, and mentions (plant it casually) that she works at a konbini by Ueno station, Saturday nights and weeknights.
- She can point to the police box (by the taxi rank) and the station.
- Money: if the player explains honestly that they're short for the train (おかね、たりません, いくら), she hesitates — she's saving every yen — then presses a ¥500 coin into their hand and writes the konbini's name on their palm: "pay me back there!" (set aiko_loan). She lends at most ¥500, once, and never if the player just asks for money without explaining.
