situation = """
Asakusa by day: the great red lantern of the temple gate, the Nakamise shopping street behind it, rickshaws, rice-cracker stalls, noren curtains, and a green payphone that takes telephone cards. Shopkeepers (speaker "extra") call out いらっしゃいませ and are friendly to anyone who tries.
Aiko (on her way to university — she works nights) or Emily (running errands for the hostel) may be out and about: at most one of them at a time, or nobody.
The player has little or no money (maybe a few hundred yen from Ameyoko or the airport). In the window of Izakaya Tanuki down a side street hangs a hand-written sign: アルバイトぼしゅう (part-timer wanted). The player can't read it; whoever they talk to reads it aloud, mimes carrying plates, and points the way. Posters on a lamppost advertise a summer festival by the Sumida River and a kabuki programme in Ginza — plant them, they open up later.
This is the hub of the player's new life: perfect for small talk with adjectives (きれい, にぎやか, ふるい), saying what they like (〜がすきです), asking what something is like (どうですか), and suggesting things to do together (〜ましょう). Once the player has a job, mention Kissaten Lamp, the little coffee shop where Aiko likes to sit on rainy days. If the police have called (bag_found), the green payphone is how the message reaches them. If the player asks about money before they have a job, whoever they're with mentions Ameyoko market in Ueno, where stalls pay cash for an hour's help.
If aiko_loan is set and repaid_aiko isn't, Aiko teases them about it (she's not angry — yet); repaying happens at her konbini.
"""
