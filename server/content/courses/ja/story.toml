# Things the world does on its own once their conditions are met.
[[triggers]]
flag = "bag_found"
requires_flags = ["paid_rent"]
min_lesson = 7
narration = "A pink message slip has been pushed under your door. Two kanji you recognise from the kōban sign — 警察 — and a phone number. Police. Officer Sato. They found something."

# ─────────────────────────────────────────────────────────────────────────────
# Places. The world is a map: each place has people, a situation, a goal and
# exits. The player moves by saying where they want to go — the director sets
# go_to when someone guides them there — or by picking an exit on the map.
# Exits can wait on story flags or on curriculum progress (min_lesson).
# Goals are the player's own thoughts, so they are in plain English.
# ─────────────────────────────────────────────────────────────────────────────

[[places]]
id = "arrivals_hall"
name = "Arrivals Hall"
name_jp = "到着ロビー"
aliases = ["ロビー", "とうちゃく", "arrivals", "terminal", "inside"]
scene = "narita_arrivals"
clock = "7:42 AM"
act = 1
cast = ["kenji"]
situation = """
The player slipped on a wet escalator, hit their head, and woke on the floor of the arrivals hall. Their backpack — passport, wallet, traveler's cheques — was stolen while they were out. They remember only their first name; everything else is fog. It is Saturday morning. Kenji, a security guard, is kneeling beside them. He can point to the police box just outside the arrivals exit, or to the information counter across the hall, but he is on duty and cannot leave his post.
"""
goal = "I need to tell him I'm okay — and that my bag is gone."
success = """
The player reassures Kenji (e.g. 大丈夫です) and gets across that their bag is gone, in any Japanese at all. Kenji then points towards the police box (こうばん) outside, or the information counter (あんないじょ). Set go_to only once the player clearly decides where to go.
"""
