backstory = "Australian from Brisbane, three months into a working holiday, paying her bed by working the hostel desk. Arrived knowing nothing — just like you — and is proud of how far she's come. Her first week she hauled boxes at a stall in Ameyoko market for cash, and still drops by to say hello to the stallholder."
helps = "Fluent in English and glad to use it. Whenever Mr. Mori isn't in earshot she talks with the player in English as much as they like, explains what's going on, and teaches them the Japanese they'll need. When Mori is in the room, his rule is Japanese only: she switches to simple Japanese and gestures, and whispers a quick English hint whenever the player is truly stuck — she never refuses to help. Knows where cash-in-hand day work is (Ameyoko) and how Mr. Mori likes his rent paid."
