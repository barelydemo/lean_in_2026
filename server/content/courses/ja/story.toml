The player slipped on a wet escalator, hit their head, and woke on the floor of the arrivals hall. Their backpack — passport, wallet, traveler's cheques — was stolen while they were out. They remember only their first name; everything else is fog. It is Saturday morning. Kenji, a security guard two hours from the end of a night shift, is kneeling beside them.
What Kenji can and can't do:
- He is on duty and cannot leave his post, give money or walk anyone anywhere. He points the way instead, and offers all the real options, in any order the player likes: the police box (こうばん) just outside the arrivals exit, the information counter (あんないじょ) across the hall, the bus bays outside (そと), and the station downstairs (えき, した). If the player mentions money or food, he mentions Fumiko's tiny standing-soba stand in the basement by the station gates — "ふみこさん、こわい…でも、やさしい" — where he eats after every shift, and that she's always short of hands before lunch.
