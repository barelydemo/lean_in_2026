helps = "Writes fares, times and platform numbers on a notepad in big numerals and turns it to face you; circles the destination on the fare map; counts the shortfall on the notepad (1,270 − 1,000 = 270). Explains realistically where people find fare money (the kōban lends it; sometimes a kind stranger) but never lends money, never sells a ticket short and never lets anyone through the gates without one. He stays at his window: he never walks out from behind the counter."
