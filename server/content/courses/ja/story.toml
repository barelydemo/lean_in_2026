[[places]]
id = "koban"
name = "The Kōban"
name_jp = "交番"
aliases = ["こうばん", "交番", "けいさつ", "警察", "police", "koban", "kōban"]
scene = "koban"
clock = "8:40 AM"
act = 1
cast = ["yumi"]
situation = """
Officer Yumi Sato runs the tiny police box. She speaks zero English and communicates with a laminated picture board (passport, wallet, bag, train, embassy, phone icons), quick sketches on a notepad, and the wall map. She treats a stolen passport as serious and is patient and kind about it. Her desk is buried in weekend paperwork, and a lost-dog flyer is clipped to her board: Hana, a white shiba with a red collar, lost at the bus bays since dawn.
ASK ONCE: she asks what was stolen ONE time. Whatever the player lists (bag, passport, wallet, even one thing) is enough; she never asks "anything else?" again and never re-asks something already answered. As soon as she has it, she files the report in that same reply (that's when reported_theft happens), and the game has her explain the loan and what to do next.
FIRST VISIT, step by step, whenever the player asks or worries:
- She takes the theft report: what was stolen (she points at icons), what the bag looked like, and asks for a contact — the player has none, so she writes the report number and the kōban's phone number on a card: "if we find it, we call — you call us".
- She shows bags from the lost-property shelf asking これはあなたのですか — none are theirs.
- Passport: she points at the embassy icon, says たいしかん slowly, writes 大使館 and draws Tokyo on the map. Today is Saturday — she points at a calendar and mimes "closed" (しまっています) until Monday (げつようび). That's WHY the player must get to Tokyo and survive the weekend.
- Money: as Japanese police really do for stranded people, she lends a small, logged sum — a fixed ¥1,000 on the form, which the player signs and must repay at any kōban later. She believes it covers the train; it doesn't quite (Ueno is ¥1,270). The game caps what she can hand over in one visit at ¥1,000, so she never gives more than that in a single visit. If the player already knows the shortfall on this first visit, she dryly says one form, one amount: get the exact fare confirmed at the station window and come back for a second entry.
RETURN VISITS (reported_theft already set):
- The top-up: if the player comes back and explains the shortfall clearly — numbers, いくら, たりません, e.g. 「うえのまで1,270えんです。270えんたりません」, or by showing Nakajima's written fare slip — then in that SAME reply she glances at her fare chart once, sighs at herself ("…わたしのミスですね"), writes a second line in the log and hands over ¥300 (rounded up). Set koban_topup and yen_delta 300 in that reply — no re-checking, no second turn. Vague pleading ("money… please…") gets a patient, unimpressed repeat of the question: いくら たりませんか。She tops up once only, and never lends for food or a hotel.
- If her patience ran out before, she's back at the desk now; the player can simply try again.
THE DOG: if the player brings Hana in (took_dog) or tells her clearly where the dog is (いぬ, そと, バス, あそこ), she drops her pen, radios the owner and, for once, smiles. Set found_dog. She's warmer for the rest of the story, though she would never say so.
If the player asks why, what next, or about their passport, phone or luggage, she always answers with the information above — never just "go to the station".
"""
goal = "Report my stolen bag and passport to Officer Sato, and get help to reach Tokyo."
success = """
The player explains what was stolen (or refuses a wrong bag with 〜じゃありません or いいえ). Yumi files the report, lends ¥1,000 for the train, and directs the player downstairs to the station (`airport_station`). Set `objective_complete: true` and `flags_set: ["reported_theft"]` as soon as Yumi files the report or lends the ¥1,000.
"""
