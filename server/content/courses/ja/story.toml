# ─────────────────────────────────────────────────────────────────────────────
# Curriculum: Genki I, lessons 0–12, in order. This is the player's own
# progress track; wherever they are, conversations drill the current lesson.
# ─────────────────────────────────────────────────────────────────────────────

[[lessons]]
index = 0
title = "Greetings"
title_jp = "あいさつ"
topic = "Greetings & survival expressions"
min_grammar = 2
min_turns = 3

  [[lessons.grammar]]
  id = "g0_daijoubu"
  pattern = "大丈夫です"
  meaning = "I'm okay / it's fine (and 大丈夫ですか？ = are you okay?)"
  example_jp = "はい、大丈夫です。"
  example_romaji = "Hai, daijoubu desu."
  example_en = "Yes, I'm okay."

  [[lessons.grammar]]
  id = "g0_sumimasen"
  pattern = "すみません"
  meaning = "Excuse me / I'm sorry — the most useful word in Japan"
  example_jp = "すみません、ありがとうございます。"
  example_romaji = "Sumimasen, arigatou gozaimasu."
  example_en = "Sorry — thank you so much."

  [[lessons.grammar]]
  id = "g0_hai_iie"
  pattern = "はい / いいえ"
  meaning = "Yes / no"
  example_jp = "いいえ、わかりません。"
  example_romaji = "Iie, wakarimasen."
  example_en = "No, I don't understand."

  [[lessons.grammar]]
  id = "g0_wakarimasen"
  pattern = "わかりません"
  meaning = "I don't understand"
  example_jp = "すみません、わかりません。"
  example_romaji = "Sumimasen, wakarimasen."
  example_en = "Sorry, I don't understand."

  [[lessons.grammar]]
  id = "g0_arigatou"
  pattern = "ありがとうございます"
  meaning = "Thank you (polite)"
  example_jp = "どうもありがとうございます。"
  example_romaji = "Doumo arigatou gozaimasu."
  example_en = "Thank you very much."


  [[lessons.vocab]]
  jp = "かばん"
  romaji = "kaban"
  en = "bag"

  [[lessons.vocab]]
  jp = "ない / ありません"
  romaji = "nai / arimasen"
  en = "(it's) not here / there isn't"

  [[lessons.vocab]]
  jp = "あたま"
  romaji = "atama"
  en = "head"


  [[lessons.candos]]
  id = "l0_okay"
  text = "I can say I'm okay"
  example = "だいじょうぶです。"
  example_reading = "Daijoubu desu."
  match_all = [["だいじょうぶ", "大丈夫", "daijoubu", "daijobu", "daijyoubu"]]

  [[lessons.candos]]
  id = "l0_sorry"
  text = "I can say excuse me / sorry"
  example = "すみません。"
