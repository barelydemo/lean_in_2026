# Lexical — "Lost in Japan"
#
# All story, cast and curriculum content lives here so writers can edit it
# without touching Rust. The server validates this file at startup.
#
# Curriculum: chapters follow the grammar progression of Genki I
# (lessons 0–7). Situations, dialogue and examples are original; only the
# ordering of grammar topics follows the textbook.


title = "Lost in Japan"
title_jp = "迷子の日本"
start_place = "arrivals_hall"

# Field convention for every course file: `jp`/`name_jp`/`title_jp` hold the
# TARGET language, `en`/`name`/`title` the LEARNER's language, `romaji` the
# reading aid. Here: Japanese / English / Hepburn romaji.
[course]
id = "ja"
target_lang = "ja"
learner_lang = "en"
target_name = "Japanese"
learner_name = "English"
reading = "Hepburn romaji with spaces between words"
label = "Learn Japanese"
tagline = "Lost in Japan · Narita, 1998"
currency = "¥"
locked_lesson = "I'm not ready yet — I need more Japanese first (Lesson {lesson})."
locked_unknown = "I don't know how to get there yet."
premise = """
It is spring 1998. No smartphones, no internet translation, no mobile phone for a tourist: people use payphones with telephone cards, paper maps, pocket diaries and traveler's cheques. Keep every detail period-true (Tokyo Tower, not Skytree; CDs and pagers; city-pop on shop radios). Money is yen.
The player landed at Narita on a Saturday morning, slipped on a wet escalator, hit their head, and woke to find their backpack — passport, wallet, traveler's cheques — stolen. No money, no guidebook, no Japanese at all. A lost passport means going to their embassy in Tokyo, which is closed until Monday — so first they have to get into the city and survive the weekend. Over one long day and the next morning, the people they meet help them recover. The thief was a man in a grey cap and a red jacket who shouldered past them at the top of the escalator.
The curriculum follows the Genki I grammar sequence (lessons 0–12).
"""

[course.landing]
title = "Lost in Japan.\nTalk your way home."
body = "Narita, 1998. No smartphone, no translator app — and now no passport, no wallet, no Japanese. Just a battered pocket dictionary and your voice. Every word you learn moves the story forward."
scene = "narita_exterior"
place = "Narita Airport"
clock = "Apr 1998 · 7:42 AM"
character = "aiko"
feature_scenes = ["konbini_night", "koban", "station_concourse"]
lines = [
  { jp = "だいじょうぶですか？", romaji = "daijoubu desu ka?", en = "Are you okay?" },
  { jp = "すみません…かばんがありません！", romaji = "sumimasen... kaban ga arimasen!", en = "Sorry… my bag is gone!" },
  { jp = "おにぎりはどこにありますか？", romaji = "onigiri wa doko ni arimasu ka?", en = "Where are the rice balls?" },
  { jp = "レジのとなりにありますよ！", romaji = "reji no tonari ni arimasu yo!", en = "Next to the register!" },
  { jp = "うえのまで、いくらですか。", romaji = "ueno made, ikura desu ka.", en = "How much is it to Ueno?" },
]


