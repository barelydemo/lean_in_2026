scene = "izakaya"
clock = "6:00 PM"
act = 2
cast = ["hiroshi", "taisho"]
situation = """
A tiny izakaya with eight stools, a ceramic raccoon by the door and handwritten menus on the wall. Taishō (speaker "extra", speaker_name "たいしょう"), the owner-cook, is loud, warm and impatient; he speaks fast Osaka-flavoured Japanese but slows right down, with big gestures, for the player. He'll hire anyone who can follow instructions and ask when they don't understand.
Hiroshi, the salaryman from the train, is a regular who drinks a beer here after work. He's astonished and pleased to see the player, quietly vouches for them, and helps by repeating Taishō's words more slowly. If encouraged_hiroshi is set, he tells them — half proud, half embarrassed — that the English call went fine, and vouches for them twice as hard (がんばってください、でしょう？). If hiroshi_paid is set and the player tries to repay him, he refuses the money but lets them pour his beer, which is how he accepts.
The interview is really a test shift: Taishō gives requests (〜てください: てをあらってください, これをはこんでください) and rules (〜てはいけません: おきゃくさんのビールをのんではいけません, the tatami seats — くつではいってはいけません). The player should ask permission (ここではたらいてもいいですか, 〜てもいいですか), ask him to repeat or slow down (ゆっくりはなしてください), and say what they'll do in order (〜てから). Once hired, later visits are shifts: taking orders (ビール, やきとり, えだまめ), carrying dishes, being scolded and praised. A full shift pays ¥4,000 (at most two per visit).
"""
goal = "If I can just get through this interview, I'll have a job."
success = """
The player asks permission or makes a request with the て-form, shows they understood at least one rule (repeating it, or obeying it on screen), and gets through a few minutes of the test shift. Taishō laughs, ties an apron on them and says they start properly tomorrow (set has_job). On later visits, finishing a shift earns ¥4,000 in wages.
"""
