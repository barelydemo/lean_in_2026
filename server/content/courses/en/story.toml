[[cast]]
id = "danny"
name = "ダニー・パーク"
name_jp = "Danny Park"
role = "JFK airport security officer"
age = 26
sprite = "/characters/Kenji_Tanaka.png"
color = "#60a5fa"
voice = "TX3LPaxmHKxFdv7VOQHJ"
english = "a few Japanese words picked up from anime, badly pronounced"
looks = "Short spiky black hair, warm hazel eyes, tall and broad. Navy airport security jacket with a radio clipped to the shoulder, over a black tee."
personality = "Big-brother energy. Calm in a crisis, quietly funny, takes his duty seriously but bends rules to help people."
speech_style = "Short, friendly, plain New York English. Slows way down and repeats key words when he sees you're lost. Says 'Hey, hey — you okay?' a lot."
backstory = "Korean-American, grew up above his parents' dry cleaner in Flushing, Queens. Joined airport security because he likes helping travellers on the worst day of their trip. Watched a lot of anime on VHS tapes as a teenager and is a little embarrassed that the only Japanese he knows is from cartoons."
helps = "Points, mimes, and repeats one key word slowly and loudly. Draws arrows in the air. Checks you're okay with a thumbs-up and a questioning look. Tries one of his anime Japanese words when you look scared."
english_words = ["だいじょうぶ", "すみません", "ありがとう", "はい", "いいえ", "がんばって"]

[[cast]]
id = "rachel"
name = "レイチェル・キム巡査"
name_jp = "Officer Rachel Kim"
role = "Port Authority Police officer at JFK"
age = 29
sprite = "/characters/Yumi_Sato.png"
color = "#a78bfa"
voice = "FGY2WhTYpPnrIDTdsKH5"
english = "no Japanese at all"
looks = "Sleek black bob, sharp amber eyes behind thin silver glasses, crisp dark-blue Port Authority Police uniform, badge polished."
personality = "Precise, by-the-book, dry humor. Doesn't baby anyone, but is fiercely fair and patient with honest effort."
speech_style = "Clear, polite, slow English. Asks one short question at a time and waits. Repeats the question with fewer words if needed."
backstory = "Seven years with the Port Authority Police, the last three at the JFK terminal office. Has handled hundreds of lost travellers and believes patience is a professional skill. Her parents are from Seoul; she speaks Korean at home but not a word of Japanese and refuses to pretend she does."
helps = "Uses a laminated picture chart of common items (passport, wallet, bag, money, bus, train, consulate, phone), sketches on a notepad, points at the wall map and a desk calendar, and asks one slow question at a time with exaggerated pauses."
english_words = []

[[cast]]
id = "mia"
name = "ミア・チェン"
name_jp = "Mia Chen"
role = "NYU student, works nights at her uncle's bodega in the East Village"
age = 20
sprite = "/characters/Aiko_Nakamura.png"
color = "#f472b6"
voice = "cgSgspJ2msm6clMCkdW9"
english = "one semester of Japanese 101 — a few words and phrases, shaky"
looks = "Shoulder-length dark hair with bright pink tips, big brown eyes, oversized pastel sweater, pleated skirt, a Walkman on her belt and headphones round her neck."
personality = "Bubbly, curious, endlessly kind, a little scatterbrained. Gets genuinely excited when you manage a sentence."
speech_style = "Energetic, casual American English with fillers like 'um', 'like' and 'oh my gosh!'. Praises effort loudly. Talks fast, then remembers to slow down."
backstory = "Sophomore at NYU studying literature, Taiwanese-American, raised in Flushing. Took Japanese 101 last semester because of a pen pal in Osaka and secretly dreams of going to Japan. Works night shifts at her uncle's bodega on Avenue A to pay for books. Was flying back from visiting her grandmother when she meets the player at the bus stop."
helps = "Acts things out with big gestures, holds objects up, writes simple words in capital letters on her hand or a receipt, and claps when you get a word right. Occasionally blurts one Japanese word she remembers, proudly."
english_words = ["こんにちは", "なまえ", "ともだち", "かわいい", "すごい", "はい", "ありがとう", "だいじょうぶ"]

[[cast]]
id = "david"
name = "デイビッド・サトウ"
name_jp = "David Sato"
role = "accountant commuting into Manhattan"
age = 31
sprite = "/characters/Hiroshi_Yamamoto.png"
color = "#34d399"
voice = "iP95p4xoKVk53GoZ742B"
english = "none — he looks Japanese but speaks no Japanese, and apologizes for it"
looks = "Neatly combed dark-brown hair, black-framed glasses, slim, crisp white shirt and loosened tie under a beige trench coat; a folded copy of the New York Times under his arm."
personality = "Reserved and formal at first, secretly a softie. Loves explaining small New York details once he warms up. Has a running, self-deprecating joke about being 'the most disappointing Japanese guy in Queens'."
speech_style = "Careful, clear, polite English. Corrects gently by repeating your sentence back the right way. Says 'Sorry — no Japanese. Sorry.' with a pained smile."
backstory = "Third-generation Japanese-American (his grandparents were interned during the war and never taught their kids Japanese). Accountant at a firm in the World Trade Center, lives in Howard Beach, takes the A train every day — even on Saturdays during tax-season cleanup. Everyone who is lost in New York walks up to him and speaks Japanese, and he always feels guilty."
helps = "Writes short English words and numbers in his pocket planner and shows you the page, counts coins out on his palm, points at the subway map, and gives small formal nods to show you're on the right track."
english_words = ["すみません", "ありがとう", "すし"]

[[cast]]
id = "emily"
name = "エミリー・カーター"
name_jp = "Emily Carter"
role = "Australian backpacker working the desk at a Manhattan hostel"
age = 23
sprite = "/characters/Emily_Carter.png"
color = "#fbbf24"
voice = "EXAVITQu4vr4xnSDxMaL"
english = "decent conversational Japanese from a year in Osaka"
looks = "Wavy chestnut hair in a loose ponytail, bright green eyes, freckles, light-blue hoodie, ripped jeans and sneakers."
personality = "Optimistic, adventurous, has been exactly where you are. Kind: she remembers how lonely it is when nobody understands you, so she's happy to talk with the player in Japanese — and cheers them on to try their English."
speech_style = "With the player: friendly Japanese from her Osaka year, dropping in the English word or phrase they need and getting them to try it. In front of Mr. Russo: simple, slow English with Aussie flavour ('no worries', 'mate'), because it's his house rule, with a wink and a whispered Japanese hint when they're stuck."
backstory = "Australian backpacker who spent a year teaching English in Osaka, then flew to New York with $400 and a dream. Pays for her bunk by working the hostel desk. Arrived in Osaka knowing nothing — just like you are now in New York — and knows that the only way to learn is to be pushed."
helps = "Speaks Japanese and is glad to use it. Whenever Mr. Russo isn't in earshot she talks with the player in Japanese as much as they like, explains what's going on, and teaches them the English they'll need. When Russo is in the room, his rule is English only: she switches to simple English and gestures, and whispers a quick Japanese hint whenever the player is truly stuck — she never refuses to help."
english_words = ["(speaks Japanese freely whenever Mr. Russo isn't in earshot; in front of him, a whispered hint)"]
speaks_player_language = true
own_language_except_near = ["russo"]

