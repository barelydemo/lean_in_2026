# Lexical — "Lost in New York" (Learn English, for Japanese speakers)
#
# All story, cast and curriculum content lives here so writers can edit it
# without touching Rust. The server validates this file at startup.
#
# Curriculum: an original A1 English syllabus for Japanese speakers
# (lessons 0–12, A1→A2). Situations, dialogue and examples are original.


title = "ニューヨークで迷子"
title_jp = "Lost in New York"
start_place = "jfk_arrivals"

# Field convention for every course file: `jp`/`name_jp`/`title_jp` hold the
# TARGET language, `en`/`name`/`title` the LEARNER's language, `romaji` the
# reading aid. Here: English / Japanese / katakana pronunciation guide.
[course]
id = "en"
target_lang = "en"
learner_lang = "ja"
target_name = "English"
learner_name = "Japanese"
reading = "katakana pronunciation guide"
label = "英語を学ぶ"
tagline = "ニューヨークで迷子 · JFK空港、1998年"
currency = "$"
locked_lesson = "まだ無理だ…もっと英語を覚えないと（レッスン {lesson}）。"
locked_unknown = "まだ行き方がわからない。"
locked_story = "まだだ。ここでやることを先に終わらせないと。"
told_flags = ["knows_hostel", "job_lead"]
# The beta demo ends at boarding the subway into Manhattan; full-access players go on.
demo_end = "subway_car"
set_off = "歩きだす：{label}。"
arrive = "{place}に着いた。"
pause = "少しの沈黙。相手はあなたがもう一度言うのを待っている。"
nod = "相手はうなずいた。ちゃんと伝わったようだ。"
premise = """
It is April 1998. No smartphones, no internet translation, no mobile phone for a tourist: people use payphones (25 cents a call, or a prepaid phone card), paper subway maps, pagers, Walkmans and traveler's cheques. Keep every detail period-true: the Twin Towers stand on the skyline; subway fares are paid with brass tokens or the new MetroCard ($1.50 a ride); yellow cabs, bodegas on every corner, boomboxes and pay-per-minute phone cards. There is NO AirTrain (it opened in 2003): from JFK a free shuttle bus runs to Howard Beach station, where you catch the A train into Manhattan. Money is US dollars.
The player, a Japanese traveller, landed at JFK on a Saturday morning, slipped on a wet escalator, hit their head, and woke to find their backpack — passport, wallet, traveler's cheques — stolen. They remember only their first name. No money, no guidebook, no English at all. A lost passport means going to the Consulate General of Japan in Manhattan, which is closed until Monday — so first they have to get into the city and survive the weekend. Over one long day and the next morning, the people they meet help them recover. The thief was a man in a grey cap and a red jacket who shouldered past them at the top of the escalator.
Characters speak simple, slow, natural American (or Australian) English, adapted to the player's level. They know at most a handful of Japanese words and never translate whole sentences for the player.
After that first weekend the story runs on through the following weeks of spring into early summer: the player lives at the Bowery Bunkhouse, works at Ruby's Diner, pays weekly rent to gruff Mr. Russo (who turns out to be their late grandfather's oldest friend), gets their stolen bag back through the police, and slowly recovers their memory.
The curriculum is an A1→A2 English syllabus for Japanese speakers (lessons 0–12).
"""



[course.landing]
title = "ニューヨークで迷子。\n言葉で帰り道をひらけ。"
body = "1998年、JFK空港。スマホも翻訳アプリもない。パスポートも財布も盗まれ、英語はひとことも話せない。あるのは古い電子辞書と、自分の声だけ。覚えた言葉が物語を動かす。"
scene = "jfk_curb"
place = "JFK空港"
clock = "1998年4月 · 午後4:15"
character = "mia"
feature_scenes = ["bodega_night", "jfk_police", "subway_car"]
lines = [
  { jp = "Are you okay?", romaji = "アー ユー オウケイ？", en = "大丈夫？" },
  { jp = "Sorry… my bag is gone!", romaji = "ソーリー… マイ バッグ イズ ゴーン！", en = "すみません…かばんがないんです！" },
  { jp = "Where's the water?", romaji = "ウェアズ ザ ウォーター？", en = "水はどこですか？" },
  { jp = "In the back, by the fridge!", romaji = "イン ザ バック、バイ ザ フリッジ！", en = "奥の冷蔵庫のそばだよ！" },
  { jp = "One ticket to Manhattan, please.", romaji = "ワン ティケット トゥ マンハッタン、プリーズ。", en = "マンハッタンまで一枚ください。" },
]

