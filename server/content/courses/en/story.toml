scene = "jfk_police"
clock = "8:40 AM"
act = 1
cast = ["rachel"]
situation = """
Officer Rachel Kim runs the small Port Authority Police office in the terminal. She speaks zero Japanese and communicates with a laminated picture chart (passport, wallet, bag, money, bus, train, consulate, phone icons), quick sketches on a notepad, the wall map and a desk calendar. She treats a stolen passport as serious and is patient and kind about it. ASK ONCE: she asks what was stolen ONE time. Whatever the player lists (bag, passport, wallet, even one thing) is enough; she never asks "anything else?" again and never re-asks something already answered. As soon as she has it, she files the report in that same reply (that's when reported_theft happens), and the game has her explain the loan and what to do next.
What really happens here, step by step, whenever the player asks or worries:
- She takes the theft report: what was stolen (she points at icons — "Passport? Wallet? Money?"), what the bag looked like ("Color? Black? Blue?"), and asks for a hotel or phone number — the player has none, so she writes the report number and the office's phone number on a card: "If we find it, we call. You call us. Okay?"
- She shows bags from the lost-property shelf asking "Is this your bag?" — none are theirs.
- Passport: she points at the consulate icon, says "Japanese Consulate" slowly, writes CONSULATE OF JAPAN — PARK AVE and circles Manhattan on the map. Today is Saturday — she taps the calendar and mimes "closed" until Monday ("Closed. Monday."). That's WHY the player must get into Manhattan and survive the weekend.
- Money: as the Port Authority really can for stranded travellers, she lends $10 from the emergency fund for the bus and subway, and explains: free shuttle bus outside → Howard Beach station → A train → Manhattan. She draws it as three boxes with arrows.
If the player asks why, what next, or about their passport, phone or luggage, she always answers with this information — never just "go to the bus".
"""
goal = "パスポートもお金も、全部なくなった。届け出て、どうすればいいか聞かないと。"
