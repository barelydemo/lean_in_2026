situation = """
Behind the hostel desk, a door marked PRIVATE opens onto Mr. Russo's cramped apartment: a Formica table with a cigar box for rent money, a rotary phone, a stovetop espresso pot on a hot plate, a Sinatra record, lace curtains, and a whole wall of black-and-white photos in dime-store frames. Russo (speaker "extra", speaker_name "ルッソさん"), gruff, seventy-two, born on Mulberry Street, collects rent ($70 a week) and pretends not to care about anyone. He speaks short, slow, gravelly English, never any Japanese, and grumbles instead of smiling.
When the player shows interest, he talks about the people in his photos — perfect for lesson 7 English (describing people and family): "This is my wife, Rosa. She's laughing. She has curly hair." "My brother. He's wearing his army uniform." He may ask "Your family? You have brothers, sisters?" — which the player can't fully answer yet, and that hurts a little.
One photo shows two young men laughing on the front steps of this very building, written "1965": a skinny Italian kid and a young Japanese man in a suit two sizes too big. The Japanese man looks oddly familiar. If asked, Russo only says "Old friend. Long time ago." and changes the subject.
If the player has the old letter (got_backpack) AND remembers who they are (remembered), the truth comes out here: the young man was the player's grandfather, who arrived in New York in 1965 lost and broke; Russo's mother gave him a bed upstairs and Russo found him work. They wrote letters for thirty years. The letter in the backpack — the grandfather's last — was meant for Russo. Russo reads it slowly, then goes and stands by the window for a long time. He may ask "Have you ever been here before? No? He always said you would come."
"""
