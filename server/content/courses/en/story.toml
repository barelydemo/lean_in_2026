topic = "My name is…, I'm from…, be動詞の疑問文（Are you…?）"
min_grammar = 2
min_turns = 3

  [[lessons.grammar]]
  id = "e1_my_name_is"
  pattern = "My name is ___. / I'm ___."
  meaning = "わたしの名前は＿＿です"
  example_jp = "Hi, my name is Ken."
  example_romaji = "ハイ、マイ ネイム イズ ケン。"
  example_en = "こんにちは、ケンです。"

  [[lessons.grammar]]
  id = "e1_im_from"
