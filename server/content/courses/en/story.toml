# ─────────────────────────────────────────────────────────────────────────────
# Curriculum: an A1→A2 English syllabus for Japanese speakers, lessons 0–12, in
# order. This is the player's own progress track; wherever they are,
# conversations drill the current lesson.
# ─────────────────────────────────────────────────────────────────────────────

[[lessons]]
index = 0
title = "サバイバル英語"
title_jp = "Survival English"
topic = "あいさつと、困ったときのひとこと"
min_grammar = 2
min_turns = 3

  [[lessons.grammar]]
  id = "e0_im_okay"
  pattern = "I'm okay. / Are you okay?"
  meaning = "大丈夫です／大丈夫ですか？（okay = fine = all right）"
  example_jp = "Yes, I'm okay."
  example_romaji = "イエス、アイム オウケイ。"
  example_en = "はい、大丈夫です。"

  [[lessons.grammar]]
  id = "e0_excuse_me_sorry"
  pattern = "Excuse me. / Sorry."
  meaning = "Excuse me＝声をかける「すみません」、Sorry＝あやまる「すみません」"
  example_jp = "Excuse me — sorry!"
  example_romaji = "エクスキューズ ミー — ソーリー！"
  example_en = "すみません、ごめんなさい！"

  [[lessons.grammar]]
  id = "e0_yes_no"
  pattern = "Yes. / No."
  meaning = "はい／いいえ"
  example_jp = "No, I don't understand."
  example_romaji = "ノウ、アイ ドウント アンダスタンド。"
  example_en = "いいえ、わかりません。"

  [[lessons.grammar]]
  id = "e0_dont_understand"
  pattern = "I don't understand."
  meaning = "わかりません（Slowly, please.＝ゆっくりお願いします）"
  example_jp = "Sorry, I don't understand."
  example_romaji = "ソーリー、アイ ドウント アンダスタンド。"
  example_en = "すみません、わかりません。"

  [[lessons.grammar]]
  id = "e0_thank_you"
  pattern = "Thank you. / Thanks."
  meaning = "ありがとう（Thank you very much.＝どうもありがとうございます）"
  example_jp = "Thank you very much."
  example_romaji = "サンキュー ヴェリー マッチ。"
  example_en = "どうもありがとうございます。"


  [[lessons.vocab]]
  jp = "bag"
  romaji = "バッグ"
  en = "かばん"

  [[lessons.vocab]]
  jp = "gone"
  romaji = "ゴーン"
  en = "なくなった"

  [[lessons.vocab]]
  jp = "head"
  romaji = "ヘッド"
  en = "あたま"


  [[lessons.candos]]
  id = "ec0_okay"
  text = "「大丈夫です」と言える"
  example = "I'm okay."
  example_reading = "アイム オウケイ。"
  match_all = [["okay", "ok", "fine", "alright", "all right", "オーケー", "オッケー"]]

  [[lessons.candos]]
  id = "ec0_sorry"
  text = "「すみません」と言える"
  example = "Excuse me. / Sorry."
  example_reading = "エクスキューズ ミー。／ソーリー。"
  match_all = [["sorry", "excuse me", "pardon", "ソーリー"]]

  [[lessons.candos]]
  id = "ec0_thanks"
  text = "「ありがとう」と言える"
  example = "Thank you."
  example_reading = "サンキュー。"
  match_all = [["thank", "thanks", "サンキュー"]]

  [[lessons.candos]]
  id = "ec0_dont_understand"
  text = "「わかりません」と言える"
  example = "I don't understand."
  example_reading = "アイ ドウント アンダスタンド。"
  match_all = [["don't", "dont", "do not", "not", "no"], ["understand", "know"]]

[[lessons]]
index = 1
