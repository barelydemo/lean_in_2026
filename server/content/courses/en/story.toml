# Things the world does on its own once their conditions are met.
[[triggers]]
flag = "bag_found"
requires_flags = ["paid_rent"]
min_lesson = 7
narration = "ホステルの受付に伝言メモが置いてある。エミリーの丸い字で「Officer Kim called! NYPD 9th Precinct, E. 5th St. — 98-0418」。受理番号だ。何か見つかったらしい。"

# ─────────────────────────────────────────────────────────────────────────────
# Places. The world is a map: each place has people, a situation, a goal and
# exits. The player moves by saying where they want to go — the director sets
# go_to when someone guides them there — or by picking an exit on the map.
# Exits can wait on story flags or on curriculum progress (min_lesson).
# Goals are the player's own thoughts, so they are in plain Japanese.
# ─────────────────────────────────────────────────────────────────────────────

[[places]]
id = "jfk_arrivals"
name = "到着ロビー"
name_jp = "International Arrivals"
aliases = ["arrivals", "arrival", "terminal", "inside", "lobby", "escalator", "ロビー", "到着", "とうちゃく", "ターミナル"]
scene = "jfk_arrivals"
clock = "7:42 AM"
act = 1
cast = ["danny"]
situation = """
The player slipped on a wet escalator, hit their head, and woke on the floor of the JFK international arrivals hall. Their backpack — passport, wallet, traveler's cheques — was stolen while they were out. They remember only their first name; everything else is fog. It is Saturday morning. Danny, a security officer, is kneeling beside them. He can point to the Port Authority Police office down the hall, or to the information desk across the hall, but he is on duty and cannot leave his post. He may try one of his anime Japanese words (だいじょうぶ?) when the player looks scared, which should be funny and comforting — but then he goes back to slow English.
"""
goal = "大丈夫だって伝えなきゃ。それと、かばんがなくなったことも。"
success = """
The player reassures Danny (e.g. "I'm okay") and gets across that their bag is gone, in any English at all. Danny then points towards the police office ("police — there") or the information desk. Set go_to only once the player clearly decides where to go.
"""
goal_flags = []
on_enter_flags = []
reward_yen = 0
reward_items = []
recharge = 0

candos = ["ec0_okay", "ec0_sorry", "ec0_dont_understand"]

  [[places.pack]]
  jp = "okay"
  romaji = "オウケイ"
  en = "大丈夫"

  [[places.pack]]
  jp = "sorry"
  romaji = "ソーリー"
  en = "すみません（あやまる）"

  [[places.pack]]
  jp = "bag"
  romaji = "バッグ"
  en = "かばん"

  [[places.pack]]
  jp = "gone"
  romaji = "ゴーン"
  en = "なくなった"

  [[places.pack]]
  jp = "head"
  romaji = "ヘッド"
  en = "あたま"

  [[places.pack]]
  jp = "police"
  romaji = "ポリース"
  en = "警察"

  [[places.pack]]
  jp = "over there"
  romaji = "オウヴァー ゼア"
  en = "あそこ"

  [[places.events]]
  flag = "asked_for_help"
  when = "the player tells Danny what happened (the bag, the passport, the wallet) or asks him what to do, and he points them to the Port Authority police office"
  label = "Danny points you to the police"
  must_convey = ["the Port Authority police office is nearby in the terminal: that is where to report a theft"]

  [[places.exits]]
  to = "jfk_police"
  label = "ダニーが指さす警察の窓口"
  requires_flags = []
  min_lesson = 0

  [[places.exits]]
  to = "jfk_info"
  label = "ロビーの向こうの案内所"
  requires_flags = []
  min_lesson = 0

  [[places.exits]]
  to = "jfk_curb"
  label = "ガラスのドアから外へ"
  requires_flags = []
  min_lesson = 0

  [[places.intro]]
  speaker = "narrator"
  scene = "jfk_arrivals"
  transition = "fade"
  ambient = "dust"
  en = "ニューヨーク、JFK国際空港。国際線到着ロビー。1998年4月、午前7時42分。"

  [[places.intro]]
  speaker = "narrator"
  en = "十三時間のフライト。睡眠ゼロ。看板は全部アルファベットのパズル。アナウンスは、言葉のないメロディーみたいだ。"

  [[places.intro]]
  speaker = "narrator"
  en = "英語はまったく話せない。ひとことも。ガイドブックはリュックの中だ。"

  [[places.intro]]
  speaker = "narrator"
  camera = "pan_right"
  en = "エスカレーターの上で、グレーのキャップに赤いジャケットの男が肩をぶつけてきた。男は振り返らない。"

  [[places.intro]]
  speaker = "narrator"
  en = "エスカレーターはとても長くて、とてもピカピカで、そして——気づいた時にはもう遅い——とても濡れていた。"

  [[places.intro]]
  speaker = "narrator"
  camera = "shake"
  transition = "flash"
  sfx = "thud"
  en = "——！"

  [[places.intro]]
  speaker = "narrator"
  transition = "blackout"
  en = "……"

  [[places.intro]]
  speaker = "extra"
  speaker_name = "???"
  jp = "…Hey. Hey, you okay?"
  romaji = "…ヘイ。ヘイ、ユー オウケイ？"
  en = "…おい。おい、大丈夫？"

  [[places.intro]]
  speaker = "narrator"
  transition = "wake"
  camera = "tilt_blur"
  en = "光。まぶしすぎる光。誰かの顔が、ぼんやりと目の前に浮かんでくる。"

  [[places.intro]]
  speaker = "danny"
  expression = "worried"
  action = "enter_right"
  emote = "exclaim"
  jp = "Whoa, whoa — are you okay?!"
  romaji = "ウォウ、ウォウ — アー ユー オウケイ？！"
  en = "おいおい、大丈夫か？！"

  [[places.intro]]
  speaker = "narrator"
  camera = "zoom_in"
  en = "ポケットを探る。財布——ない。トラベラーズチェック——ない。パスポートの入ったリュック——ない。"

  [[places.intro]]
  speaker = "narrator"
  sfx = "bell"
  en = "ジャケットの内ポケットで、指が何かに触れた。おばさんが貸してくれた英和電子辞書だ。液晶にはヒビ。単三電池が二本、ほとんど空っぽ。単語は引けるけど、文の翻訳はできない。一回一回、大事に使わないと。"

  [[places.intro]]
  speaker = "danny"
  expression = "worried"
  action = "lean_in"
  emote = "sweat"
  jp = "Your head… okay? Uh… daijoubu?"
  romaji = "ユア ヘッド… オウケイ？ アー… ダイジョウブ？"
  en = "頭…大丈夫？ えっと…「だいじょうぶ」？"


  [[places.choices]]
  jp = "Yes, I'm okay."
  romaji = "イエス、アイム オウケイ。"
  en = "はい、大丈夫です。"

  [[places.choices]]
  jp = "Sorry… my bag… gone!"
  romaji = "ソーリー… マイ バッグ… ゴーン！"
